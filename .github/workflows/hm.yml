name: HarmonyOS Phone Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Environment
        run: |
          npm install -g ohpm
          ohpm install @tarojs/cli
          
      - uses: harmonyos/setup-sdk@v1
        
      - name: Build Phone HAP
        run: |
          taro build --type harmony --platform phone
          zip -r phone.hap dist/
          
      - uses: actions/upload-artifact@v3
        with:
          name: phone-hap-unsigned
          path: phone.hap
