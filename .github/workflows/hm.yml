name: HarmonyOS Phone Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: |
          npm install -g @tarojs/cli
          npm install
          
      # 修复点1：使用正确的官方 Action 名称
      - name: Setup HarmonyOS SDK
        uses: harmonyos-dev/setup-harmonyos-sdk@v1
        
      - name: Build Phone HAP
        run: |
          taro build --type harmony --platform phone
          zip -r phone-unsigned.zip dist/
          
      # 修复点2：升级 upload-artifact 到 v4
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-hap-unsigned
          path: phone-unsigned.zip
