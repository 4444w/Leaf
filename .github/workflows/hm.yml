name: HarmonyOS Phone Build (Manual SDK)

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: |
          npm install -g @tarojs/cli
          npm install
          
      # 替代方案：手动下载并配置 HarmonyOS SDK 和 ohpm
      - name: Setup HarmonyOS Environment
        run: |
          # 下载 commandline-tools (请根据华为官方最新链接替换此URL)
          wget -q https://repo.huaweicloud.com/harmonyos/commandline-tools/commandline-tools-linux.zip -O commandline-tools.zip
          unzip -q commandline-tools.zip -d commandline-tools
          
          # 将 ohpm 和 hvigor 添加到环境变量
          echo "$PWD/commandline-tools/bin" >> $GITHUB_PATH
          echo "$PWD/commandline-tools/hvigor/bin" >> $GITHUB_PATH
          
          # 配置环境变量供后续构建使用
          echo "HARMONYOS_SDK_HOME=$PWD/commandline-tools" >> $GITHUB_ENV
          
      - name: Build Phone HAP
        run: |
          taro build --type harmony --platform phone
          zip -r phone-unsigned.zip dist/
          
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-hap-unsigned
          path: phone-unsigned.zip
