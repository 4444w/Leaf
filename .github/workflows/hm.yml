name: HarmonyOS Native Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup HarmonyOS Environment
        run: |
          # 下载鸿蒙命令行工具
          wget -q https://repo.huaweicloud.com/harmonyos/commandline-tools/commandline-tools-linux.zip -O clt.zip
          unzip -q clt.zip -d commandline-tools
          
          # 将 ohpm 和 hvigor 添加到环境变量
          echo "$PWD/commandline-tools/bin" >> $GITHUB_PATH
          echo "$PWD/commandline-tools/hvigor/bin" >> $GITHUB_PATH
          
          # 配置环境变量供构建使用
          echo "OHPM_CLI_HOME=$PWD/commandline-tools" >> $GITHUB_ENV
          echo "HVIGOR_APP_HOME=$PWD" >> $GITHUB_ENV
          
      - name: Install Dependencies
        # 原生鸿蒙项目使用 ohpm 安装依赖
        run: ohpm install --all
        
      - name: Build Phone HAP
        # 使用 hvigorw 构建未签名的 HAP 包
        run: hvigorw assembleHap --mode module -p module=entry@default --no-daemon
        
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-hap-unsigned
          # 原生项目构建后的未签名 HAP 默认路径通常在此
          path: entry/build/default/outputs/default/entry-default-unsigned.hap
