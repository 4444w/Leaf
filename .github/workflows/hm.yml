# ═══════════════════════════════════════════════════════════════════════
#  Leaf Browser — HarmonyOS NEXT HAP 构建工作流
# ═══════════════════════════════════════════════════════════════════════
#
#  ★ 核心原理：
#  HarmonyOS NEXT SDK 不提供公开下载，只能通过 DevEco Studio 获取。
#  因此我们把 SDK 上传到 GitHub Release，CI 从 Release 下载后构建。
#
#  ★ 一次性准备步骤（只需做一次）：
#
#  在电脑上安装 DevEco Studio 后，SDK 会自动下载到：
#    Windows: C:\Users\你\AppData\Local\Huawei\Sdk\openharmony
#    macOS:   ~/Library/Huawei/Sdk/openharmony
#    Linux:   ~/Huawei/Sdk/openharmony
#
#  打包并上传：
#    cd ~/Library/Huawei/Sdk
#    zip -r /tmp/sdk.zip openharmony/
#
#  然后在 GitHub 仓库创建 Release：
#    1. 进入仓库 → Releases → Draft a new release
#    2. Tag: sdk-v1
#    3. Title: SDK
#    4. 上传 sdk.zip（2-3GB，GitHub 支持）
#    5. Publish release
#
#  之后每次推送代码，CI 自动构建！
# ═══════════════════════════════════════════════════════════════════════

name: Build HAP

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '18'
  # SDK Release tag — 与你上传 SDK 时的 tag 一致
  SDK_RELEASE_TAG: 'sdk-v1'
  SDK_FILENAME: 'sdk.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      # ── 1. 检出代码 ──
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ──
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── 3. 缓存 SDK（避免每次重复下载 2-3GB） ──
      #- name: 💾 Cache SDK
      #  uses: actions/cache@v4
      #  id: cache-sdk
      #  with:
      #    path: ~/ohos-sdk
      #    key: ohos-sdk-v3-${{ env.SDK_RELEASE_TAG }}

      # ── 4. 从 GitHub Release 下载 SDK ──
      - name: 📦 Download SDK from Release
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        id: download-sdk
        run: |
          mkdir -p "$HOME/ohos-sdk"

          echo "==> 从 GitHub Release 下载 SDK ..."
          echo "Release tag: ${{ env.SDK_RELEASE_TAG }}"
          echo "仓库: ${{ github.repository }}"

          # 使用 GitHub API 获取 Release 资产下载链接
          RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.SDK_RELEASE_TAG }}"

          echo "请求: $RELEASE_URL"

          # 获取 Release 信息
          RESPONSE=$(curl -s -f \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "$RELEASE_URL" 2>&1) || {
            echo ""
            echo "❌ 未找到 Release tag: ${{ env.SDK_RELEASE_TAG }}"
            echo ""
            echo "═══════════════════════════════════════════════════════"
            echo "  请按以下步骤上传 SDK（只需做一次）："
            echo "═══════════════════════════════════════════════════════"
            echo ""
            echo "1. 在电脑上安装 DevEco Studio"
            echo "   https://developer.huawei.com/consumer/cn/deveco-studio/"
            echo ""
            echo "2. 找到 SDK 目录（DevEco Studio 会自动下载）："
            echo "   Windows: C:\\Users\\你\\AppData\\Local\\Huawei\\Sdk"
            echo "   macOS:   ~/Library/Huawei/Sdk"
            echo "   Linux:   ~/Huawei/Sdk"
            echo ""
            echo "3. 打包 openharmony 子目录："
            echo "   cd ~/Library/Huawei/Sdk"
            echo "   zip -r /tmp/sdk.zip openharmony/"
            echo ""
            echo "4. 上传到 GitHub Release："
            echo "   - 进入仓库 → Releases → Draft a new release"
            echo "   - Tag: sdk-v1"
            echo "   - 上传 sdk.zip"
            echo "   - Publish release"
            echo ""
            echo "5. 重新触发此构建"
            echo ""
            echo "═══════════════════════════════════════════════════════"
            echo ""
            echo "has_sdk=false" >> $GITHUB_OUTPUT
            exit 0
          }

          # 从 Release JSON 中提取 sdk.zip 的下载 URL
          DOWNLOAD_URL=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
            data = json.load(sys.stdin)
            for asset in data.get('assets', []):
              if asset.get('name') == '${{ env.SDK_FILENAME }}':
                print(asset['url'])
                sys.exit(0)
            print('')
          except:
            print('')
          " 2>/dev/null)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo ""
            echo "❌ Release 存在但未找到 ${{ env.SDK_FILENAME }}"
            echo "请确保在 Release 中上传了名为 '${{ env.SDK_FILENAME }}' 的文件"
            echo ""
            echo "has_sdk=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ 找到 SDK 下载链接"
          echo "下载中（2-3GB，可能需要几分钟）..."

          # 下载 SDK（使用 GitHub API 认证）
          curl -L -f \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -o /tmp/sdk.zip \
            "$DOWNLOAD_URL" && {

            FILE_SIZE=$(stat -c%s /tmp/sdk.zip 2>/dev/null || echo 0)
            echo "下载完成: ${FILE_SIZE} bytes"

            if [ "$FILE_SIZE" -gt 1000000 ]; then
              echo "解压 SDK ..."
              unzip -q /tmp/sdk.zip -d "$HOME/ohos-sdk" && {
                echo "✅ SDK 解压成功"
                rm -f /tmp/sdk.zip
                echo "has_sdk=true" >> $GITHUB_OUTPUT
              } || {
                echo "❌ SDK 解压失败"
                rm -f /tmp/sdk.zip
                echo "has_sdk=false" >> $GITHUB_OUTPUT
              }
            else
              echo "❌ 下载文件太小 (${FILE_SIZE} bytes)，可能不是有效的 SDK"
              rm -f /tmp/sdk.zip
              echo "has_sdk=false" >> $GITHUB_OUTPUT
            fi
          } || {
            echo "❌ SDK 下载失败"
            echo "has_sdk=false" >> $GITHUB_OUTPUT
          }

      # ── 5. 配置构建环境 ──
      - name: ⚙️ Setup build environment
        id: env
        run: |
          # 写入 local.properties
          cat > local.properties << EOF
          ohos.sdk.dir=$HOME/ohos-sdk/openharmony
          nodejs.dir=$(dirname $(which node))
          npm.dir=$(dirname $(which npm))
          EOF
          sed -i 's/^[[:space:]]*//' local.properties
          cat local.properties

          # 环境变量
          echo "OHOS_SDK_HOME=$HOME/ohos-sdk" >> $GITHUB_ENV

          # 检查 SDK 完整性
          HAS_SDK=false
          SDK_DIR="$HOME/ohos-sdk"

          if [ -d "$SDK_DIR" ]; then
            echo "SDK 目录内容:"
            find "$SDK_DIR" -maxdepth 3 -type d 2>/dev/null | head -30

            # 检查关键目录
            if find "$SDK_DIR" -maxdepth 4 -type d -name "ets" 2>/dev/null | grep -q .; then
              HAS_SDK=true
              echo "✅ SDK 内容完整（找到 ets 目录）"
            elif find "$SDK_DIR" -maxdepth 4 -type d -name "openharmony" 2>/dev/null | grep -q .; then
              HAS_SDK=true
              echo "✅ SDK 内容完整（找到 openharmony 目录）"
            else
              echo "⚠️ SDK 目录存在但内容不完整"
              ls -la "$SDK_DIR"
            fi
          else
            echo "❌ SDK 目录不存在"
          fi

          echo "has_sdk=${HAS_SDK}" >> $GITHUB_OUTPUT

      # ── 6. 安装依赖 (使用 ohpm 代替 npm) ──
      - name: 📦 Install dependencies
        if: steps.env.outputs.has_sdk == 'true'
        run: |
          # 查找 ohpm 可执行文件
          OHPM_BIN=$(find "$HOME/ohos-sdk" -name "ohpm" -type f 2>/dev/null | grep -E "bin/ohpm$" | head -1)
          
          if [ -z "$OHPM_BIN" ]; then
            echo "❌ 未在 SDK 中找到 ohpm 工具！"
            echo "请确认打包的 SDK 中是否包含 toolchains/ohpm 目录"
            exit 1
          fi
          
          chmod +x "$OHPM_BIN"
          OHPM_DIR=$(dirname $(dirname "$OHPM_BIN"))
          echo "✅ 找到 ohpm: $OHPM_BIN"
          
          # 设置 OHPM 环境变量，后续构建也需要
          echo "OHPM_HOME=$OHPM_DIR" >> $GITHUB_ENV
          echo "PATH=$OHPM_DIR/bin:$PATH" >> $GITHUB_ENV
          
          # 根目录安装依赖
          echo "==> 根目录 ohpm install ..."
          "$OHPM_BIN" install --all 2>&1 | tail -20
          
          # entry 模块安装依赖
          if [ -d "entry" ]; then
            echo "==> entry 模块 ohpm install ..."
            cd entry && "$OHPM_BIN" install 2>&1 | tail -10 && cd ..
          fi

      # ── 7. 构建 HAP (使用 hvigorw 代替 npx hvigor) ──
      - name: 🏗️ Build HAP
        if: steps.env.outputs.has_sdk == 'true'
        id: build
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "==> 构建 HAP (type: ${BUILD_TYPE}) ..."

          # 确保 hvigorw 可执行
          chmod +x hvigorw

          # 执行构建 (使用 ./hvigorw 而不是 npx hvigor)
          ./hvigorw assembleHap \
            --mode module -p module=entry@default \
            --no-daemon \
            2>&1 | tee build.log || true

          # 判断结果
          if grep -q "BUILD SUCCESSFUL" build.log 2>/dev/null; then
            echo "✅ 构建成功"
            echo "success=true" >> $GITHUB_OUTPUT
          elif find . -name "*.hap" -not -path "*/node_modules/*" -not -path "*/oh_modules/*" | grep -q .; then
            echo "✅ 找到 HAP 文件（构建可能成功）"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ 构建失败"
            echo ""
            echo "=== 构建日志最后 50 行 ==="
            tail -50 build.log || true
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      # ── 8. 收集产物 ──
      - name: 📋 Collect artifacts
        id: collect
        run: |
          mkdir -p output
          FOUND=0

          while IFS= read -r hap; do
            if [ -n "$hap" ]; then
              SIZE=$(du -h "$hap" | cut -f1)
              echo "✅ HAP: $hap ($SIZE)"
              cp "$hap" output/
              FOUND=1
            fi
          done < <(find . -name "*.hap" -not -path "*/node_modules/*" -not -path "*/oh_modules/*" 2>/dev/null)

          # 保存日志
          [ -f "build.log" ] && cp build.log output/

          echo "found=${FOUND}" >> $GITHUB_OUTPUT

      # ── 9. 上传产物 ──
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LeafBrowser-HAP
          path: output/
          retention-days: 30
          if-no-files-found: warn

      # ── 10. 摘要 ──
      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🌿 Leaf Browser Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 分支 | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 类型 | \`${{ github.event.inputs.build_type || 'debug' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SDK | \`${{ steps.env.outputs.has_sdk }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Node | \`${{ env.NODE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.collect.outputs.found }}" = "1" ]; then
            echo "### ✅ HAP 构建成功！" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "在 Artifacts 中下载 \`LeafBrowser-HAP\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "安装到 Mate 80:" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "hdc install entry-default-signed.hap" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

          elif [ "${{ steps.env.outputs.has_sdk }}" = "true" ]; then
            echo "### ⚠️ SDK 可用但构建失败" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "请查看 \`build.log\` 了解错误原因。" >> $GITHUB_STEP_SUMMARY
            echo "常见问题：SDK API 版本与代码不匹配、缺少依赖" >> $GITHUB_STEP_SUMMARY

          else
            echo "### ❌ SDK 不可用" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "HarmonyOS NEXT SDK 不提供公开下载，需要你手动上传到 GitHub Release。" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 上传 SDK 步骤（只需做一次）" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**1. 安装 DevEco Studio**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "https://developer.huawei.com/consumer/cn/deveco-studio/" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**2. 找到 SDK 目录**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '| 系统 | 路径 |' >> $GITHUB_STEP_SUMMARY
            echo '|------|------|' >> $GITHUB_STEP_SUMMARY
            echo '| Windows | \`C:\\\\Users\\\\你\\\\AppData\\\\Local\\\\Huawei\\\\Sdk\` |' >> $GITHUB_STEP_SUMMARY
            echo '| macOS | \`~/Library/Huawei/Sdk\` |' >> $GITHUB_STEP_SUMMARY
            echo '| Linux | \`~/Huawei/Sdk\` |' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**3. 打包**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "cd ~/Library/Huawei/Sdk" >> $GITHUB_STEP_SUMMARY
            echo "zip -r /tmp/sdk.zip openharmony/" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**4. 上传到 GitHub Release**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. 进入仓库 → Releases → **Draft a new release**" >> $GITHUB_STEP_SUMMARY
            echo "2. Tag: **sdk-v1**" >> $GITHUB_STEP_SUMMARY
            echo "3. 把 \`sdk.zip\` 拖进去上传" >> $GITHUB_STEP_SUMMARY
            echo "4. **Publish release**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**5. 重新触发构建**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "推送代码或手动触发，CI 会自动从 Release 下载 SDK 并构建。" >> $GITHUB_STEP_SUMMARY
          fi
