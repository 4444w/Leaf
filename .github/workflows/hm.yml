name: HarmonyOS Phone Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16' # 尝试使用 Node 16，兼容性通常更好
          
      - name: Install Global CLI
        run: npm install -g @tarojs/cli
          
      # 修改点：增加了工作目录配置，并分离了安装步骤
      - name: Install Project Dependencies
        run: npm install
        # 如果您的 package.json 不在仓库根目录，请取消下面一行的注释并修改路径
        # working-directory: ./your-subdirectory 
        
      - name: Setup HarmonyOS Environment
        run: |
          # 下载 HarmonyOS Command Line Tools
          wget -q https://repo.huaweicloud.com/harmonyos/commandline-tools/commandline-tools-linux.zip -O clt.zip
          unzip -q clt.zip -d commandline-tools
          
          # 将 ohpm 和 hvigor 添加到环境变量
          echo "$PWD/commandline-tools/bin" >> $GITHUB_PATH
          echo "$PWD/commandline-tools/hvigor/bin" >> $GITHUB_PATH
          echo "HARMONYOS_SDK_HOME=$PWD/commandline-tools" >> $GITHUB_ENV
          
      - name: Build Phone HAP
        run: |
          taro build --type harmony --platform phone
          zip -r phone-unsigned.zip dist/
          # 如果您的构建产物不在 dist 目录，请根据实际情况修改上方路径
          
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-hap-unsigned
          path: phone-unsigned.zip
