# ═══════════════════════════════════════════════════════════════════════
#  Leaf Browser — HarmonyOS NEXT HAP 构建工作流
# ═══════════════════════════════════════════════════════════════════════
#
#  构建策略（按优先级自动选择）：
#
#  策略 A — 使用你上传到 GitHub Secrets 的 SDK（最可靠 ✅）
#    1. 在电脑上用 DevEco Studio 安装好 SDK
#    2. 把 SDK 目录打包: cd ~/Huawei/Sdk && zip -r /tmp/sdk.zip openharmony/
#    3. base64 编码: base64 /tmp/sdk.zip | tr -d '\n' > /tmp/sdk.b64
#    4. 把 /tmp/sdk.b64 的内容粘贴到 GitHub → Settings → Secrets → OHOS_SDK_ARCHIVE
#    5. 推送代码或手动触发构建
#
#  策略 B — 自动从公开镜像下载 SDK（尽力而为）
#    从华为云 / OpenHarmony 镜像下载，但可能因网络或认证问题失败
#
#  策略 C — 所有自动方式都失败时，输出本地构建指南
# ═══════════════════════════════════════════════════════════════════════

name: Build HAP

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (debug / release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '18'
  HVIGOR_VER: '4.1.0'

jobs:
  # ══════════════════════════════════════════════════════════════
  #  唯一构建 Job — 自适应选择策略
  # ══════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      # ─────────────────────────────────────────
      #  Step 1: 检出代码
      # ─────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      #  Step 2: Node.js
      # ─────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ─────────────────────────────────────────
      #  Step 3: 缓存 SDK
      # ─────────────────────────────────────────
      - name: 💾 Cache SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: |
            ~/ohos-sdk
            ~/ohpm-home
          key: ohos-sdk-v2-${{ hashFiles('build-profile.json5') }}
          restore-keys: |
            ohos-sdk-v2-

      # ─────────────────────────────────────────
      #  Step 4: 安装 SDK（策略 A → 策略 B）
      # ─────────────────────────────────────────
      - name: 📦 Install SDK
        id: sdk
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$HOME/ohos-sdk"
          mkdir -p "$HOME/ohpm-home"

          ##################################################
          # 策略 A: 从 GitHub Secrets 恢复你上传的 SDK
          ##################################################
          if [ -n "${{ secrets.OHOS_SDK_ARCHIVE }}" ]; then
            echo "==> [策略A] 从 GitHub Secrets 恢复 SDK ..."
            echo "${{ secrets.OHOS_SDK_ARCHIVE }}" | base64 -d > /tmp/ohos-sdk-custom.zip
            unzip -q /tmp/ohos-sdk-custom.zip -d "$HOME/ohos-sdk"
            rm -f /tmp/ohos-sdk-custom.zip
            echo "✅ SDK 已从 Secrets 恢复"
            echo "source=secrets" >> $GITHUB_OUTPUT
            exit 0
          fi

          ##################################################
          # 策略 B: 从公开镜像下载 OpenHarmony SDK
          ##################################################
          echo "==> [策略B] 尝试从公开镜像下载 SDK ..."

          # SDK 版本列表（按新到旧排列，依次尝试）
          SDK_VERSIONS=("5.0.3.403" "5.0.2.100" "5.0.1.71" "4.1.7.7")

          DOWNLOADED=false
          for VER in "${SDK_VERSIONS[@]}"; do
            echo ""
            echo "---- 尝试 SDK 版本: ${VER} ----"

            # 镜像源列表（按可靠性排序）
            URLS=(
              # 华为云镜像（华为官方 CDN）
              "https://repo.huaweicloud.com/openharmony/sdk/${VER}/ohos-sdk-linux-${VER}.zip"
              # OpenHarmony gitee release
              "https://gitee.com/openharmony/docs/releases/download/${VER}/ohos-sdk-linux-${VER}.zip"
              # ghproxy 加速
              "https://mirror.ghproxy.com/https://github.com/openharmony/openharmony/releases/download/OpenHarmony-v${VER}-Release/ohos-sdk-linux-${VER}.zip"
              # GitHub 直连
              "https://github.com/openharmony/openharmony/releases/download/OpenHarmony-v${VER}-Release/ohos-sdk-linux-${VER}.zip"
            )

            for URL in "${URLS[@]}"; do
              echo "  尝试: $URL"
              if wget -q --timeout=30 --tries=2 "$URL" -O /tmp/ohos-sdk.zip 2>/dev/null; then
                FILE_SIZE=$(stat -c%s /tmp/ohos-sdk.zip 2>/dev/null || echo 0)
                if [ "$FILE_SIZE" -gt 1000000 ]; then
                  echo "  ✅ 下载成功 (${FILE_SIZE} bytes)"
                  if unzip -q /tmp/ohos-sdk.zip -d "$HOME/ohos-sdk" 2>/dev/null; then
                    echo "  ✅ 解压成功"
                    DOWNLOADED=true
                    rm -f /tmp/ohos-sdk.zip
                    break 2
                  else
                    echo "  ⚠️ 解压失败，尝试下一个源"
                    rm -f /tmp/ohos-sdk.zip
                  fi
                else
                  echo "  ⚠️ 文件太小 (${FILE_SIZE} bytes)，可能不是有效 SDK"
                  rm -f /tmp/ohos-sdk.zip
                fi
              fi
            done
          done

          if [ "$DOWNLOADED" = true ]; then
            echo "source=mirror" >> $GITHUB_OUTPUT
            echo "✅ SDK 下载成功"
          else
            echo "source=none" >> $GITHUB_OUTPUT
            echo "⚠️ 所有镜像源均下载失败"
            echo "请使用策略 A（上传 SDK 到 Secrets）或本地 DevEco Studio 构建"
          fi

      # ─────────────────────────────────────────
      #  Step 5: 安装 ohpm CLI
      # ─────────────────────────────────────────
      - name: 📦 Install ohpm
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/ohpm-home"

          # ohpm 版本列表
          OHPM_VERSIONS=("5.0.5" "5.0.4" "5.0.3" "5.0.2" "4.0")

          DOWNLOADED=false
          for VER in "${OHPM_VERSIONS[@]}"; do
            URLS=(
              # 华为云镜像
              "https://repo.huaweicloud.com/openharmony/ohpm/${VER}/ohpm-linux-${VER}.zip"
              # ohpm 官方
              "https://ohpm.openharmony.cn/ohpm/ohpm-cli/releases/download/v${VER}/ohpm-linux-bin-v${VER}.zip"
            )

            for URL in "${URLS[@]}"; do
              echo "尝试: $URL"
              if wget -q --timeout=30 --tries=2 "$URL" -O /tmp/ohpm.zip 2>/dev/null; then
                FILE_SIZE=$(stat -c%s /tmp/ohpm.zip 2>/dev/null || echo 0)
                if [ "$FILE_SIZE" -gt 100000 ]; then
                  echo "✅ ohpm 下载成功"
                  unzip -q /tmp/ohpm.zip -d "$HOME/ohpm-home" 2>/dev/null || true
                  DOWNLOADED=true
                  rm -f /tmp/ohpm.zip
                  break 2
                fi
                rm -f /tmp/ohpm.zip
              fi
            done
          done

          # 设置可执行权限
          find "$HOME/ohpm-home" -name "ohpm" -type f -exec chmod +x {} \; 2>/dev/null || true

          if [ "$DOWNLOADED" = false ]; then
            echo "⚠️ ohpm 下载失败，将通过 npm 安装 hvigor 作为替代"
          fi

      # ─────────────────────────────────────────
      #  Step 6: 配置构建环境
      # ─────────────────────────────────────────
      - name: ⚙️ Configure environment
        id: env
        run: |
          # ── 写入 local.properties ──
          cat > local.properties << EOF
          ohos.sdk.dir=$HOME/ohos-sdk
          nodejs.dir=$(dirname $(which node))
          npm.dir=$(dirname $(which npm))
          EOF
          sed -i 's/^[[:space:]]*//' local.properties
          cat local.properties

          # ── 环境变量 ──
          echo "OHOS_SDK_HOME=$HOME/ohos-sdk" >> $GITHUB_ENV
          echo "OHPM_HOME=$HOME/ohpm-home" >> $GITHUB_ENV

          # ── 查找 ohpm ──
          OHPM_BIN=$(find "$HOME/ohpm-home" -name "ohpm" -type f 2>/dev/null | head -1)
          if [ -n "$OHPM_BIN" ]; then
            echo "✅ ohpm: $OHPM_BIN"
            echo "OHPM_BIN=$OHPM_BIN" >> $GITHUB_ENV
            echo "$(dirname $OHPM_BIN)" >> $GITHUB_PATH
          else
            echo "⚠️ ohpm 未找到"
          fi

          # ── 检查 SDK 完整性 ──
          HAS_SDK=false
          # 检查是否有 ets/native/toolchains 等目录
          if [ -d "$HOME/ohos-sdk" ] && [ "$(ls -A $HOME/ohos-sdk 2>/dev/null)" ]; then
            # 进一步检查是否有真正的 SDK 内容
            SDK_CONTENT=$(find "$HOME/ohos-sdk" -maxdepth 3 -type d 2>/dev/null | head -20)
            if echo "$SDK_CONTENT" | grep -qiE "ets|native|toolchains|openharmony"; then
              HAS_SDK=true
              echo "✅ SDK 内容完整"
              echo "$SDK_CONTENT"
            else
              echo "⚠️ SDK 目录存在但内容不完整:"
              ls -la "$HOME/ohos-sdk"
            fi
          else
            echo "⚠️ SDK 目录为空或不存在"
          fi

          echo "has_sdk=${HAS_SDK}" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────
      #  Step 7: 安装项目依赖
      # ─────────────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          echo "==> 安装 npm 依赖 + hvigor ..."
          npm install --legacy-peer-deps 2>&1 | tail -10

          echo "==> 安装 entry 模块依赖 ..."
          cd entry && npm install --legacy-peer-deps 2>&1 | tail -5 && cd ..

          echo "==> 安装 oh_modules ..."
          if [ -n "$OHPM_BIN" ] && [ -x "$OHPM_BIN" ]; then
            echo "使用 ohpm: $OHPM_BIN"
            $OHPM_BIN install 2>&1 | tail -10 || echo "ohpm install 根目录失败（可忽略）"
            cd entry && $OHPM_BIN install 2>&1 | tail -5 || echo "ohpm install entry 失败（可忽略）" && cd ..
          else
            echo "ohpm 不可用，跳过 oh_modules"
          fi

          echo "==> 验证 hvigor ..."
          npx hvigor --version 2>/dev/null || echo "hvigor 未安装"

      # ─────────────────────────────────────────
      #  Step 8: 构建 HAP
      # ─────────────────────────────────────────
      - name: 🏗️ Build HAP
        id: build
        if: steps.env.outputs.has_sdk == 'true'
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "==> 构建 HAP (type: ${BUILD_TYPE}) ..."
          echo "SDK: $OHOS_SDK_HOME"

          # 确保 hvigorw 有执行权限
          [ -f "hvigorw" ] && chmod +x hvigorw || true

          # 构建
          npx hvigor assembleHap \
            --mode ${BUILD_TYPE} \
            -p module=entry@default \
            --no-daemon \
            2>&1 | tee build.log || true

          # 检查是否构建成功
          if grep -q "BUILD SUCCESSFUL" build.log 2>/dev/null; then
            echo "✅ 构建成功"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ 构建可能失败"
            echo ""
            echo "=== 构建日志最后 30 行 ==="
            tail -30 build.log
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      # ─────────────────────────────────────────
      #  Step 9: 收集构建产物
      # ─────────────────────────────────────────
      - name: 📋 Collect artifacts
        id: collect
        run: |
          mkdir -p output
          FOUND=0

          # 搜索 HAP 文件
          echo "==> 搜索 HAP 文件 ..."
          while IFS= read -r hap; do
            if [ -n "$hap" ]; then
              SIZE=$(du -h "$hap" | cut -f1)
              echo "✅ 找到 HAP: $hap ($SIZE)"
              cp "$hap" output/
              FOUND=1
            fi
          done < <(find . -name "*.hap" -not -path "*/node_modules/*" -not -path "*/oh_modules/*" 2>/dev/null)

          # 保存构建日志
          [ -f "build.log" ] && cp build.log output/

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "❌ 未找到 HAP 文件"
            echo ""

            # 生成详细的本地构建指南
            cat > output/README.md << 'GUIDE'
          # 🌿 Leaf Browser — 本地构建指南

          ## CI 自动构建未成功

          HarmonyOS NEXT SDK 需要通过 DevEco Studio 下载，无法在公开 CI 中自动获取。

          ---

          ## ✅ 推荐方式：DevEco Studio 本地构建

          ### 第 1 步：安装 DevEco Studio

          下载地址：https://developer.huawei.com/consumer/cn/deveco-studio/

          支持 Windows / macOS。

          ### 第 2 步：打开项目

          1. 启动 DevEco Studio
          2. File → Open → 选择本项目根目录
          3. 等待 SDK 自动下载（首次约 2-3 GB）
          4. 等待索引完成

          ### 第 3 步：连接 Mate 80

          1. 手机: 设置 → 关于手机 → 连点版本号 7 次（开启开发者模式）
          2. 设置 → 系统与更新 → 开发者选项 → 开启 USB 调试
          3. USB 连接电脑，手机弹窗点「允许调试」

          ### 第 4 步：运行

          点击 DevEco Studio 顶部 ▶ Run 按钮，选择你的 Mate 80 设备。

          或者构建 HAP 文件：Build → Build Hap(s)

          HAP 输出路径: `entry/build/default/outputs/default/entry-default-signed.hap`

          ### 第 5 步：命令行安装（可选）

          ```bash
          hdc install entry/build/default/outputs/default/entry-default-signed.hap
          ```

          ---

          ## 🔄 让 CI 也能构建（可选）

          如果你希望 GitHub Actions 也能自动构建，请按以下步骤操作：

          ### 方法 1：上传 SDK 到 GitHub Secrets

          1. 在电脑上找到 SDK 目录（DevEco Studio 安装后）:
             - Windows: `C:\Users\<用户名>\AppData\Local\Huawei\Sdk\openharmony`
             - macOS: `~/Library/Huawei/Sdk/openharmony`

          2. 打包 SDK:
             ```bash
             cd ~/Library/Huawei/Sdk
             zip -r /tmp/sdk.zip openharmony/
             ```

          3. Base64 编码:
             ```bash
             base64 /tmp/sdk.zip | tr -d '\n' > /tmp/sdk.b64
             ```

          4. 添加到 GitHub Secrets:
             - 进入 GitHub 仓库 → Settings → Secrets and variables → Actions
             - New repository secret
             - Name: `OHOS_SDK_ARCHIVE`
             - Value: 粘贴 `/tmp/sdk.b64` 的全部内容

          5. 推送代码触发构建，CI 会自动使用你上传的 SDK

          ### 方法 2：Fork 到 Gitee 用流水线构建

          Gitee 有国内加速，SDK 下载更稳定。
          GUIDE
          fi

          echo "found=${FOUND}" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────
      #  Step 10: 上传产物
      # ─────────────────────────────────────────
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LeafBrowser-HAP
          path: output/
          retention-days: 30
          if-no-files-found: warn

      # ─────────────────────────────────────────
      #  Step 11: 构建摘要
      # ─────────────────────────────────────────
      - name: 📊 Summary
        if: always()
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          SDK_STATUS="${{ steps.env.outputs.has_sdk }}"

          echo "## 🌿 Leaf Browser Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 分支 | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 类型 | \`${BUILD_TYPE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SDK 可用 | \`${SDK_STATUS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | \`${{ env.NODE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Hvigor | \`${{ env.HVIGOR_VER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.collect.outputs.found }}" = "1" ]; then
            echo "### ✅ HAP 构建成功！" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "在 Artifacts 中下载 \`LeafBrowser-HAP\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "hdc install entry-default-signed.hap" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${SDK_STATUS}" = "true" ]; then
            echo "### ❌ SDK 可用但构建失败" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "SDK 已下载但编译出错，请查看 build.log 了解详情。" >> $GITHUB_STEP_SUMMARY
            echo "常见问题：" >> $GITHUB_STEP_SUMMARY
            echo "- API 版本不兼容（SDK API 与代码使用的 API 不匹配）" >> $GITHUB_STEP_SUMMARY
            echo "- 缺少 oh_modules 依赖" >> $GITHUB_STEP_SUMMARY
            echo "- 签名配置缺失（未签名 HAP 需要手机开启开发者模式）" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ SDK 不可用，无法自动构建" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "HarmonyOS NEXT SDK 需要通过 DevEco Studio 下载，公开镜像可能无法获取。" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 方案 A：本地 DevEco Studio 构建（推荐 ✅）" >> $GITHUB_STEP_SUMMARY
            echo "1. 安装 [DevEco Studio](https://developer.huawei.com/consumer/cn/deveco-studio/)" >> $GITHUB_STEP_SUMMARY
            echo "2. 打开项目 → Build → Build Hap(s)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 方案 B：上传 SDK 到 Secrets 让 CI 构建" >> $GITHUB_STEP_SUMMARY
            echo "1. 从 DevEco Studio 导出 SDK 目录" >> $GITHUB_STEP_SUMMARY
            echo "2. 打包 zip → base64 编码" >> $GITHUB_STEP_SUMMARY
            echo "3. 存到 GitHub Secrets → \`OHOS_SDK_ARCHIVE\`" >> $GITHUB_STEP_SUMMARY
            echo "4. 重新触发构建" >> $GITHUB_STEP_SUMMARY
          fi
