name: HarmonyOS Native Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup HarmonyOS SDK
        uses: harmonyos-dev/setup-harmonyos-sdk@main
        
      - name: Initialize OHPM and Configure Registry
        run: |
          # 1. 创建 ohpm 目录和初始化标记文件，骗过初始化检查
          mkdir -p $HOME/.ohpm
          echo "initialized" > $HOME/.ohpm/.ohpm_init_flag
          
          # 2. 关键修复：必须在用户目录下创建 ohpmrc 文件，否则 ohpm 认为未初始化
          echo "registry=https://ohpm.harmonyos.cn/ohpm/" > $HOME/.ohpm/ohpmrc
          echo "@ohos:registry=https://ohpm.harmonyos.cn/ohpm/" >> $HOME/.ohpm/ohpmrc
          
          # 3. 同时在项目根目录下也创建一份 .ohpmrc，确保优先级最高，解决 404 问题
          echo "registry=https://ohpm.harmonyos.cn/ohpm/" > .ohpmrc
          echo "@ohos:registry=https://ohpm.harmonyos.cn/ohpm/" >> .ohpmrc
          
      - name: Install Dependencies
        run: ohpm install
        
      - name: Build Phone HAP
        run: |
          chmod +x hvigorw
          ./hvigorw assembleHap --mode module -p module=entry@default --no-daemon
        
      - name: Upload HAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-hap-unsigned
          path: entry/build/default/outputs/default/entry-default-unsigned.hap
